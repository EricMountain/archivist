name: Android CI

# Plan step 2.16 (docs/plans/02-android-mvp.md). Build + unit tests + instrumented
# tests on a Gradle-managed device for every PR, matching "CI and release" in
# docs/design/android.md. Release/publish lives in android-release.yml instead --
# kept separate so a PR run never needs the signing/Play secrets.

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's standard 2-vCPU Linux runners support hardware-accelerated Android
      # virtualization, but the calling user still needs KVM group access -- this is
      # the documented recipe for granting it.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Caches the Gradle User Home (dependencies + build cache) across runs via the
      # GitHub Actions cache -- this repo's stand-in for a self-hosted remote build
      # cache server, which a self-hosted-per-user project has nowhere to run.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The runner's preinstalled Android SDK has no licenses pre-accepted for the
      # system image the Gradle managed device (pixel2api30, see testOptions in
      # app/build.gradle.kts) downloads on first use, so :app:pixel2api30Setup fails
      # with LicenceNotAcceptedException without this. `sdkmanager` isn't on PATH on
      # this runner image, so locate it under cmdline-tools instead of assuming it is.
      - name: Accept Android SDK licenses
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          yes | "$sdkmanager" --licenses --sdk_root="$sdk_root" > /dev/null

      - name: Unit tests
        run: ./gradlew --no-daemon :core:crypto:testDebugUnitTest :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Instrumented tests (Gradle managed device)
        run: ./gradlew --no-daemon :app:pixel2api30DebugAndroidTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            android/app/build/reports/tests/
            android/core/crypto/build/reports/tests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
