name: Android Release

# Plan step 2.16 (docs/plans/02-android-mvp.md). Tagging android-vX.Y.Z assembles,
# signs and uploads the app bundle to the Play internal track -- no manual Play
# Console step. See "CI and release" in docs/design/android.md for the secrets this
# depends on and why the tag is prefixed (this repo also holds the unrelated
# Terraform-deployed backend, which has its own release path).

on:
  push:
    tags:
      - "android-v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compute version name from tag
        run: echo "ARCHIVIST_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # publishBundle depends on the whole chain (bundleRelease, signing, etc.) -- one
      # task is the entire release. versionCode comes from the Play Console itself
      # (play { resolutionStrategy.set(AUTO) } in app/build.gradle.kts); versionName
      # comes from ARCHIVIST_VERSION_NAME above. ANDROID_PUBLISHER_CREDENTIALS is
      # Gradle Play Publisher's own documented convention -- the credentials file's
      # *contents*, not a path to it, confirmed against the plugin's own parse-failure
      # message locally -- so the secret is passed straight through, never written to
      # disk. Its mere presence is also what `play { enabled.set(...) }` in
      # app/build.gradle.kts checks: everywhere else (a PR build, a contributor's
      # machine) it's unset, so the plugin stays inert and assembleRelease/bundleRelease
      # need no Play access at all.
      - name: Publish to Play internal track
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:publishBundle
