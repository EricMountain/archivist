name: Backend CI

# Plan steps 3.15/3.16 (docs/plans/03-automated-updates.md). Typecheck, unit and
# integration tests (DynamoDB Local + RustFS via tools/local-infra.sh), the Lambda
# bundle, and a Terraform fmt/validate that needs no AWS access.
#
# The required check is the `backend-ci-ok` gate job, not the individual jobs: on a PR
# that touches nothing backend-related those are skipped, and a skipped job never
# reports. On `push` to main everything always runs, whatever changed.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR runs supersede each other. Runs on main never share a group: each one gates (and,
# from step 3.21, deploys) its own commit.
concurrency:
  group: backend-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      # The compare API needs only contents: read and no checkout. It lists at most
      # 300 files; at that size, or on any API error, assume everything changed.
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! files=$(gh api "repos/$REPO/compare/$BASE...$HEAD" \
              --jq 'if (.files | length) >= 300 then error("too many files") else .files[].filename end'); then
            echo "::notice::Couldn't list the PR's changed files; running everything."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(src/|test/|scripts/|terraform/|package(-lock)?\.json$|tsconfig[^/]*\.json$|vitest\.config\.ts$|\.nvmrc$|Makefile$|tools/local-infra\.sh$|\.github/workflows/backend-ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend files changed."
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: npm ci takes seconds here, and an uncached build can't be
      # poisoned by a cache another run wrote.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - run: npm ci

      # Typecheck + the whole vitest suite, including the DynamoDB Local/S3-emulator-gated
      # tests: the runner has Docker and the AWS CLI that tools/local-infra.sh needs.
      - run: make test-integration

      - run: npm run build

  terraform:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate (root module)
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: terraform validate (bootstrap)
        run: |
          terraform -chdir=terraform/bootstrap init -backend=false -input=false
          terraform -chdir=terraform/bootstrap validate

  # The one required check (step 3.17). Passes when every job it needs succeeded or
  # was skipped; fails on failure or cancellation.
  backend-ci-ok:
    needs: [changes, test, terraform]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A backend CI job finished with '$r'."; exit 1 ;;
            esac
          done

  # Step 3.21: every merge to main that passed the jobs above deploys its Lambda code,
  # dev first, then prod. Opt-in through the AUTO_DEPLOY_LAMBDAS repository variable,
  # so a fork stays inert, and so automation can be paused without editing this file.
  # CI updates function code only; Terraform stays with `make deploy` (D3). The logic
  # lives in .github/scripts/deploy-lambdas.sh, shared by both jobs.
  #
  # concurrency with cancel-in-progress false: a running deploy finishes, and of the
  # runs queued behind it only the newest one runs. That's correct, because each run
  # deploys everything between the live commit and its own.
  deploy-dev:
    needs: [changes, test, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_LAMBDAS == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    outputs:
      result: ${{ steps.deploy.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: deploy
        env:
          SHA: ${{ github.sha }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          INSTANCE_DOMAIN: ${{ secrets.INSTANCE_DOMAIN }}
          DEPLOY_ENV: dev
        run: .github/scripts/deploy-lambdas.sh

  # Only after dev deployed and passed its smoke test, or had nothing to deploy. When
  # dev skipped on pending infrastructure, prod waits too: nothing reaches prod that
  # dev hasn't run first.
  deploy-prod:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY_LAMBDAS == 'true' && needs.deploy-dev.outputs.result != 'infra-pending'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: deploy
        env:
          SHA: ${{ github.sha }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX }}
          INSTANCE_DOMAIN: ${{ secrets.INSTANCE_DOMAIN }}
          DEPLOY_ENV: prod
        run: .github/scripts/deploy-lambdas.sh

  # Step 3.22: a failed run on main (tests or deploy) opens an issue, or comments on
  # the open one. Not for PRs: a red PR is already visible on the PR. Skips, including
  # the infrastructure guard, aren't failures and open nothing.
  report-failure:
    needs: [changes, test, terraform, backend-ci-ok, deploy-dev, deploy-prod]
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/report-failure.sh
